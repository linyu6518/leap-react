<div class="lcr-container">
  <div class="page-header">
    <div class="page-title">
      <span nz-icon nzType="file-text" class="page-icon"></span>
      <div class="title-breadcrumb">
        <a routerLink="/regulatory/lcr" class="breadcrumb-link">Regulatory</a>
        <span class="breadcrumb-separator">-</span>
        <a routerLink="/regulatory/lcr" class="breadcrumb-link">Metrics</a>
        <span class="breadcrumb-separator">-</span>
        <span class="breadcrumb-current">LCR</span>
      </div>
    </div>
  </div>

  <div class="lcr-page-content">
    <nz-card class="selection-card" [class.has-entities]="showEntityTree()">
      <div class="header">
        <h2>Report Config</h2>
        <p class="subtitle">
          Configure the region, segment and time parameters to analyze LCR metrics.
        </p>
      </div>

      <form
        nz-form
        [formGroup]="form"
        nzLayout="vertical"
        class="compact-form"
        [class.with-entities]="showEntityTree()"
        (ngSubmit)="view()"
      >
        <div class="config-main">
          <nz-form-item>
            <nz-form-control nzErrorTip="Region is required">
              <div
                class="lcr-select-wrapper"
                [class.floating-label-active]="regionOpen() || form.get('region')?.value"
              >
                <nz-select
                  formControlName="region"
                  [nzPlaceHolder]="(regionOpen() || form.get('region')?.value) ? 'Select a region' : ''"
                  nzSize="large"
                  class="lcr-select"
                  (nzOpenChange)="regionOpen.set($event)"
                >
                  <nz-option nzValue="US" nzLabel="US"></nz-option>
                  <nz-option nzValue="Enterprise" nzLabel="Enterprise"></nz-option>
                </nz-select>
                <span class="floating-label">Region</span>
              </div>
            </nz-form-control>
          </nz-form-item>

          @if (form.get('region')?.value === 'US' || form.get('region')?.value === 'Enterprise') {
            <nz-form-item>
              <nz-form-control nzErrorTip="Segment is required">
                <div
                  class="lcr-select-wrapper"
                  [class.floating-label-active]="segmentOpen() || segmentFieldActive()"
                >
                  <nz-select
                    [ngModel]="selectedSegment()"
                    (ngModelChange)="onSegmentChange($event)"
                    [ngModelOptions]="{ standalone: true }"
                    [nzPlaceHolder]="(segmentOpen() || segmentFieldActive()) ? 'Select a segment' : ''"
                    nzSize="large"
                    class="lcr-select"
                    (nzOpenChange)="segmentOpen.set($event)"
                  >
                    @for (opt of segmentOptions(); track opt) {
                      <nz-option [nzValue]="opt" [nzLabel]="segmentOptionLabel(opt)"></nz-option>
                    }
                  </nz-select>
                  <span class="floating-label">Segment</span>
                </div>
              </nz-form-control>
            </nz-form-item>
          }

          <div class="date-row">
            <nz-form-item>
              <nz-form-control nzErrorTip="Prior date is required">
                <nz-date-picker
                  formControlName="prior"
                  nzSize="large"
                  nzPlaceHolder="Prior *"
                  class="lcr-datepicker"
                  style="width: 100%;"
                ></nz-date-picker>
              </nz-form-control>
            </nz-form-item>
            <nz-form-item>
              <nz-form-control nzErrorTip="Current date is required">
                <nz-date-picker
                  formControlName="current"
                  nzSize="large"
                  nzPlaceHolder="Current *"
                  class="lcr-datepicker"
                  style="width: 100%;"
                ></nz-date-picker>
              </nz-form-control>
            </nz-form-item>
          </div>

          <div class="form-divider"></div>
          <div class="form-actions">
            <button
              nz-button
              nzType="primary"
              type="submit"
              class="view-button"
              [disabled]="!canSubmit()"
            >
              View Analytics
            </button>
          </div>
        </div>

        @if (showEntityTree()) {
          <div class="config-entities">
            <app-entity-tree-select
              [region]="form.get('region')?.value"
              [segments]="segmentsSig()"
              [selectedCodes]="entities()"
              layout="vertical"
              (selectedCodesChange)="onEntitiesChange($event)"
            ></app-entity-tree-select>
          </div>
        }
      </form>
    </nz-card>
  </div>
</div>
