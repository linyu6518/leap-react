<div class="lcr-container">
  <div class="page-header">
    <div class="page-title">
      <span nz-icon nzType="file-text" class="page-icon"></span>
      <div class="title-breadcrumb">
        <a routerLink="/regulatory/lcr" class="breadcrumb-link">Regulatory</a>
        <span class="breadcrumb-separator">-</span>
        <a routerLink="/regulatory/lcr" class="breadcrumb-link">Metrics</a>
        <span class="breadcrumb-separator">-</span>
        <span class="breadcrumb-current">LCR</span>
      </div>
    </div>
  </div>

  <div class="lcr-page-content">
    <nz-card class="selection-card">
      <div class="header">
        <h2>Report Config</h2>
        <p class="subtitle">
          Configure the region, segment and time parameters to analyze LCR metrics.
        </p>
      </div>

      <form
        nz-form
        [formGroup]="form"
        nzLayout="vertical"
        class="compact-form"
        (ngSubmit)="view()"
      >
        <div class="config-main">
          <nz-form-item>
            <nz-form-control nzErrorTip="Region is required">
              <div
                class="lcr-select-wrapper"
                [class.floating-label-active]="regionOpen() || form.get('region')?.value"
              >
                <nz-select
                  formControlName="region"
                  [nzPlaceHolder]="(regionOpen() || form.get('region')?.value) ? 'Select a region' : ''"
                  nzSize="large"
                  class="lcr-select"
                  (nzOpenChange)="regionOpen.set($event)"
                >
                  <nz-option nzValue="US" nzLabel="US"></nz-option>
                  <nz-option nzValue="Enterprise" nzLabel="Enterprise"></nz-option>
                </nz-select>
                <span class="floating-label">Region</span>
              </div>
            </nz-form-control>
          </nz-form-item>

          @if (form.get('region')?.value) {
            <nz-form-item>
              <nz-form-control>
                <app-segment-tree-picker
                  [region]="form.get('region')?.value"
                  [selectedCodes]="segmentsSig()"
                  (selectedCodesChange)="onSegmentsChange($event)"
                ></app-segment-tree-picker>
              </nz-form-control>
            </nz-form-item>
          }

          <div class="date-row">
            <nz-form-item>
              <nz-form-control nzErrorTip="Prior date is required">
                <nz-date-picker
                  formControlName="prior"
                  nzSize="large"
                  nzPlaceHolder="Prior *"
                  class="lcr-datepicker"
                  style="width: 100%;"
                ></nz-date-picker>
              </nz-form-control>
            </nz-form-item>
            <nz-form-item>
              <nz-form-control nzErrorTip="Current date is required">
                <nz-date-picker
                  formControlName="current"
                  nzSize="large"
                  nzPlaceHolder="Current *"
                  class="lcr-datepicker"
                  style="width: 100%;"
                ></nz-date-picker>
              </nz-form-control>
            </nz-form-item>
          </div>

          <div class="form-divider"></div>
          <div class="form-actions">
            <button
              nz-button
              nzType="primary"
              type="submit"
              class="view-button"
              [disabled]="!canSubmit()"
            >
              View Analytics
            </button>
          </div>
        </div>
      </form>
    </nz-card>
  </div>
</div>
