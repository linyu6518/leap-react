<div class="td-select-wrapper" [class.td-select-error]="error">
  @if (label) {
    <label [attr.for]="selectId" class="td-select-label">{{ label }}</label>
  }
  <div class="td-select-inner">
    <nz-select
      [id]="selectId"
      [ngModel]="value"
      (ngModelChange)="onValueChange($event)"
      (focus)="onFocus()"
      (blur)="onBlur()"
      (nzOpenChange)="onOpenChange($event)"
      [nzPlaceHolder]="showFloatingLabel ? '' : placeholder"
      [nzDisabled]="disabled"
      [attr.aria-invalid]="error ? true : null"
      class="td-select"
    >
      @for (opt of nzOptions; track opt.value) {
        <nz-option [nzValue]="opt.value" [nzLabel]="opt.label"></nz-option>
      }
    </nz-select>
    @if (showFloatingLabel) {
      <span class="td-select-floating-label" [class.td-select-floating-label-active]="hasValue || focused || open">
        {{ floatingLabel }}
      </span>
    }
  </div>
  @if (error) {
    <div [id]="selectId + '-error'" class="td-select-error-text" role="alert">
      <span class="td-select-error-icon">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="6.5" stroke="currentColor" stroke-width="1.3" fill="none"/><path d="M7 3.5V7.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><circle cx="7" cy="10" r="0.5" fill="currentColor"/></svg>
      </span>
      <span class="td-select-error-message">{{ error }}</span>
    </div>
  }
  @if (!error && helperText) {
    <div [id]="selectId + '-helper'" class="td-select-helper-text">{{ helperText }}</div>
  }
</div>
